<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" fill="none">
  <!-- FinCore Geometric Shield & Transaction Nodes Mark -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield Gradient Contour -->
    <path d="M30 4 L52 14 C52 38 30 52 30 54 C30 52 8 38 8 14 Z" fill="#10213A" />
    <!-- Gradient Pathway Accents -->
    <path d="M22 16 H44 V23 H28 C25 23 23 25 23 28 V31 H38 V37 H23 V48 H16 V22 C16 18.7 18.7 16 22 16 Z" fill="url(#blueTealGrad)" />
    <!-- Dynamic Transaction Flow Nodes -->
    <circle cx="44" cy="19.5" r="4.5" fill="#14B8A6" />
    <circle cx="38" cy="34" r="3.5" fill="#38BDF8" />
    <circle cx="23" cy="48" r="3.5" fill="#2563EB" />
  </g>

  <!-- Wordmark "FinCore" -->
  <text x="82" y="44" font-family="'Inter', 'Poppins', -apple-system, sans-serif" font-size="32" font-weight="800" fill="#10213A" letter-spacing="-0.5">
    Fin<tspan fill="#2563EB">Core</tspan>
  </text>

  <!-- Brand Tagline -->
  <text x="84" y="60" font-family="'Inter', 'Poppins', sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1.2">
    BANKING SMARTER. TRANSACTING SIMPLER.
  </text>

  <defs>
    <linearGradient id="blueTealGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>
</svg>
